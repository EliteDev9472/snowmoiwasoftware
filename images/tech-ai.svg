<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="Neural network flowing into a snowflake-shaped core">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3760"/><stop offset="1" stop-color="#0d1f38"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a9d2ec" stop-opacity=".55"/><stop offset="1" stop-color="#a9d2ec" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="560" height="400" fill="url(#bg)"/>

  <!-- falling snow -->
  <g fill="#f5f8fb">
    <circle cx="40" cy="40" r="1.6" opacity=".6"/><circle cx="160" cy="28" r="1.2" opacity=".5"/>
    <circle cx="300" cy="50" r="1.8" opacity=".5"/><circle cx="520" cy="140" r="1.4" opacity=".6"/>
    <circle cx="60" cy="350" r="1.4" opacity=".5"/><circle cx="270" cy="370" r="1.2" opacity=".5"/>
    <circle cx="500" cy="30" r="1.2" opacity=".5"/><circle cx="30" cy="200" r="1.2" opacity=".4"/>
  </g>

  <!-- connections -->
  <g stroke="#a9d2ec" stroke-width="1" opacity=".28" fill="none">
    <path d="M110 120L220 90M110 120L220 145M110 120L220 200M110 120L220 255M110 120L220 310
             M110 173L220 90M110 173L220 145M110 173L220 200M110 173L220 255M110 173L220 310
             M110 227L220 90M110 227L220 145M110 227L220 200M110 227L220 255M110 227L220 310
             M110 280L220 90M110 280L220 145M110 280L220 200M110 280L220 255M110 280L220 310"/>
    <path d="M220 90L330 140M220 90L330 200M220 90L330 260
             M220 145L330 140M220 145L330 200M220 145L330 260
             M220 200L330 140M220 200L330 200M220 200L330 260
             M220 255L330 140M220 255L330 200M220 255L330 260
             M220 310L330 140M220 310L330 200M220 310L330 260"/>
    <path d="M330 140L445 200M330 200L445 200M330 260L445 200"/>
  </g>
  <!-- active path -->
  <path d="M110 173L220 145L330 200L445 200" stroke="#f5f8fb" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- nodes -->
  <g fill="#0d1f38" stroke="#a9d2ec" stroke-width="2">
    <circle cx="110" cy="120" r="7"/><circle cx="110" cy="227" r="7"/><circle cx="110" cy="280" r="7"/>
    <circle cx="220" cy="90" r="7"/><circle cx="220" cy="200" r="7"/><circle cx="220" cy="255" r="7"/><circle cx="220" cy="310" r="7"/>
    <circle cx="330" cy="140" r="7"/><circle cx="330" cy="260" r="7"/>
  </g>
  <g fill="#f5f8fb">
    <circle cx="110" cy="173" r="7.5"/><circle cx="220" cy="145" r="7.5"/><circle cx="330" cy="200" r="7.5"/>
  </g>

  <!-- snowflake core -->
  <circle cx="445" cy="200" r="70" fill="url(#glow)"/>
  <circle cx="445" cy="200" r="36" fill="#0d1f38" stroke="#a9d2ec" stroke-width="2"/>
  <g stroke="#f5f8fb" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M417 200H473M431 175.8L459 224.2M459 175.8L431 224.2"/>
    <path d="M466 194L473 200L466 206M424 194L417 200L424 206"/>
    <path d="M449 177L459 175.8L455 185M441 223L431 224.2L435 215"/>
    <path d="M441 177L431 175.8L435 185M449 223L459 224.2L455 215"/>
  </g>
  <circle cx="445" cy="200" r="4" fill="#f5f8fb"/>

  <!-- answer bubble -->
  <rect x="398" y="56" width="132" height="54" rx="12" fill="#f5f8fb"/>
  <path d="M426 110L432 124L442 110Z" fill="#f5f8fb"/>
  <rect x="412" y="72" width="92" height="7" rx="3.5" fill="#3d8fc4"/>
  <rect x="412" y="87" width="62" height="7" rx="3.5" fill="#a9d2ec"/>

  <!-- insight card -->
  <rect x="392" y="292" width="138" height="78" rx="12" fill="none" stroke="#a9d2ec" stroke-opacity=".45" stroke-width="1.5"/>
  <g fill="#a9d2ec">
    <rect x="410" y="336" width="12" height="20" rx="2" opacity=".55"/>
    <rect x="430" y="324" width="12" height="32" rx="2" opacity=".7"/>
    <rect x="450" y="330" width="12" height="26" rx="2" opacity=".6"/>
    <rect x="470" y="314" width="12" height="42" rx="2"/>
    <rect x="490" y="306" width="12" height="50" rx="2" fill="#f5f8fb"/>
  </g>

  <!-- input card -->
  <rect x="30" y="318" width="160" height="52" rx="12" fill="none" stroke="#a9d2ec" stroke-opacity=".45" stroke-width="1.5"/>
  <rect x="46" y="332" width="100" height="7" rx="3.5" fill="#a9d2ec" opacity=".8"/>
  <rect x="46" y="347" width="70" height="7" rx="3.5" fill="#a9d2ec" opacity=".45"/>
  <rect x="160" y="331" width="2" height="24" fill="#f5f8fb"/>
</svg>
